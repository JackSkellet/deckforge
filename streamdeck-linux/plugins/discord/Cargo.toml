[package]
name = "deckforge-discord"
version = "0.1.0"
edition = "2024"
description = "Independent native Discord RPC plugin for Deckforge"
license = "MIT"

[dependencies]
anyhow = "1"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
