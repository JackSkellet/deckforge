<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluetooth for Linux</title>
<style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;color:#edf2f5;background:#202d35}body{margin:18px;max-width:560px}label{display:block;margin:16px 0 6px}select,input[type=text],button{box-sizing:border-box;background:#18242b;border:1px solid #52636d;color:inherit;border-radius:5px;padding:9px;font:inherit}select,input[type=text]{width:100%}button{cursor:pointer;margin-top:12px}button:hover{border-color:#4bd3b0}:focus-visible{outline:2px solid #4bd3b0;outline-offset:3px}p{line-height:1.5;color:#adbdc7}.check{display:flex;gap:8px;align-items:center}#error{color:#ffb6a3;white-space:pre-wrap}h1{font-size:17px;margin-bottom:4px}[hidden]{display:none!important}
</style></head><body>
<h1>Bluetooth for Linux</h1>
<p id="status" role="status">Connecting to Bluetooth…</p>
<p id="error" role="alert" hidden></p>
<div id="device-fields"><label for="device">Device</label><select id="device"><option value="">Loading paired devices…</option></select>
<label for="label">Custom label</label><input id="label" type="text" maxlength="40" placeholder="Use device name">
<label class="check"><input id="show-label" type="checkbox" checked>Show device name</label>
<label class="check"><input id="show-battery" type="checkbox" checked>Show battery percentage when available</label></div>
<p id="help"></p><button id="refresh" type="button">Refresh devices</button>
<p>Pair new devices in your Linux Bluetooth settings. Battery levels appear only when BlueZ receives them from the device.</p>
<script src="inspector.js"></script></body></html>
